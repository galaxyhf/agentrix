[package]
name = "agentrix"
version = "0.1.0"
description = "Agentrix desktop AI agent orchestrator"
authors = ["Agentrix"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agentrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5", features = ["unstable"] }
tauri-plugin-shell = "2.2"
tauri-plugin-store = "2.2"
tauri-plugin-dialog = "2.2"
uuid = { version = "1", features = ["v4", "serde"] }
